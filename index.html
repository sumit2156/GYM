<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Power Pulse Gym</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-danger navbar-expand-lg">

<div class="container-fluid">

<a class="navbar-brand fw-bold" href="#">
<i class="fa-solid fa-dumbbell"></i>
Power Pulse
</a>

<button class="btn btn-light" onclick="logout()">
Logout
</button>

</div>

</nav>

<!-- DASHBOARD -->

<div class="container mt-4">

<div class="row g-4">

<div class="col-md-4">

<div class="card dashboard-card bg-primary text-white">

<div class="card-body">

<h5>Total Members</h5>

<h2 id="totalMembers">0</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card dashboard-card bg-success text-white">

<div class="card-body">

<h5>Total Revenue</h5>

<h2 id="totalRevenue">₹0</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card dashboard-card bg-warning text-dark">

<div class="card-body">

<h5>Attendance</h5>

<h2 id="attendancePercent">0%</h2>

</div>

</div>

</div>

</div>

<!-- TABS -->

<ul class="nav nav-pills mt-5 mb-4">

<li class="nav-item">
<button class="nav-link active"
data-bs-toggle="pill"
data-bs-target="#members">
Members
</button>
</li>

<li class="nav-item">
<button class="nav-link"
data-bs-toggle="pill"
data-bs-target="#payments">
Payments
</button>
</li>

<li class="nav-item">
<button class="nav-link"
data-bs-toggle="pill"
data-bs-target="#attendance">
Attendance
</button>
</li>

</ul>

<div class="tab-content">

<!-- MEMBERS -->

<div class="tab-pane fade show active" id="members">

<div class="card p-4 shadow-sm">

<h3>Add Member</h3>

<form id="memberForm">

<div class="row">

<div class="col-md-6 mb-3">

<input
type="text"
name="name"
class="form-control"
placeholder="Full Name"
required>

</div>

<div class="col-md-6 mb-3">

<input
type="text"
name="phone"
class="form-control"
placeholder="Phone Number"
required>

</div>

<div class="col-md-6 mb-3">

<select
name="plan"
class="form-select"
required>

<option value="">Select Plan</option>

<option value="3 Months">
3 Months
</option>

<option value="6 Months">
6 Months
</option>

<option value="12 Months">
12 Months
</option>

</select>

</div>

<div class="col-md-6 mb-3">

<input
type="date"
name="joinDate"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<input
type="date"
name="expiryDate"
class="form-control"
required>

</div>

</div>

<button class="btn btn-danger">
Add Member
</button>

</form>

</div>

<div class="card mt-4 shadow-sm">

<div class="card-header">
Members List
</div>

<div class="card-body">

<div id="membersList"></div>

</div>

</div>

</div>

<!-- PAYMENTS -->

<div class="tab-pane fade" id="payments">

<div class="card p-4 shadow-sm">

<h3>Record Payment</h3>

<form id="paymentForm">

<div class="mb-3">

<select
id="paymentMember"
class="form-select"
required>

<option value="">
Select Member
</option>

</select>

</div>

<div class="mb-3">

<input
type="number"
id="paymentAmount"
class="form-control"
placeholder="Amount"
required>

</div>

<button class="btn btn-success">
Save Payment
</button>

</form>

</div>

<div class="card mt-4 shadow-sm">

<div class="card-header">
Payment History
</div>

<div class="card-body">

<div id="paymentList"></div>

</div>

</div>

</div>

<!-- ATTENDANCE -->

<div class="tab-pane fade" id="attendance">

<div class="card p-4 shadow-sm">

<h3>Mark Attendance</h3>

<form id="attendanceForm">

<div class="mb-3">

<select
id="attendanceMember"
class="form-select"
required>

<option value="">
Select Member
</option>

</select>

</div>

<button class="btn btn-primary">
Mark Present
</button>

</form>

</div>

<div class="card mt-4 shadow-sm">

<div class="card-header">
Attendance Records
</div>

<div class="card-body">

<div id="attendanceList"></div>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>
</html>
